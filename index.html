<!DOCTYPE html>
<html lang="en">
<head>

  <title>My Profile</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="profile">
    <div class="profile__card">
      <div class="profile__avatar">
        <img src="avatar.jpg" alt="Your Name">

      <p class="profile__title">Design Engineering Apprentice</p>
      <p class="profile__bio">Product Designer/Programs Manager. Currently learning Git/Github to become a Design Engineer <br> What are you excited about?</p>
      <div class="profile__links">
        <a href="#" class="profile__link">GitHub</a>
        <a href="#" class="profile__link">Portfolio</a>
      </div>
    </div>
  </main>
</body>
</html>
